AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Coral Reef's account baseline (Streamlane ADR 0087, docs/plans/cells-and-accounts.md in the streamlane repository):
  GitHub's OIDC provider and one deploy role per repository, each trusted only by that repository's GitHub environment
  of the same name as this account's. Each names both forms of GitHub's subject: the repositories use the immutable
  one (owner and repository ids), and the plain one is kept in case that setting is turned off. The sandbox account gets none: agents deploy there with their own sign-in.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod, sandbox]

Conditions:
  Deploys: !Not [!Equals [!Ref Environment, sandbox]]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: Deploys
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # What a deploy may do: run Amplify Hosting's apps in this account (update an app's settings, upload and start a
  # deployment, or start a build of a connected app), deploy CDK stacks through the bootstrap's own roles, and read
  # what `ampx` reads to write a backend's outputs. Nothing else; a door key's own policy adds kms:GetPublicKey.
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: Deploys
    Properties:
      ManagedPolicyName: github-deploy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AmplifyApps
            Effect: Allow
            Action: amplify:*
            Resource:
              - !Sub arn:aws:amplify:*:${AWS::AccountId}:apps/*
          - Sid: AmplifyList
            Effect: Allow
            Action: amplify:ListApps
            Resource: "*"
          - Sid: BackendOutputs
            Effect: Allow
            Action:
              - appsync:GetGraphqlApi
              - appsync:GetIntrospectionSchema
              - appsync:ListGraphqlApis
            Resource: "*"
          - Sid: BackendModelSchema
            Effect: Allow
            Action: s3:GetObject
            Resource: arn:aws:s3:::amplify-*/*
          - Sid: AmplifyBuildRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/amplify-backend-deploy
            Condition:
              StringEquals:
                iam:PassedToService: amplify.amazonaws.com
          - Sid: CdkThroughBootstrapRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*
          - Sid: CdkBootstrapVersion
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*
          - Sid: PublishedNames
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/streamlane/*
          - Sid: BuildArtifacts
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub arn:aws:s3:::crv-build-artifacts-${AWS::AccountId}/*
          - Sid: ReadStacks
            Effect: Allow
            Action:
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
            Resource: "*"

  CoralReefSiteDeploy:
    Type: AWS::IAM::Role
    Condition: Deploys
    Properties:
      RoleName: github-deploy-coral-reef-site
      ManagedPolicyArns: [!Ref DeployPolicy]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:Coral-Reef-Ventures/coral-reef-site:environment:${Environment}
                  - !Sub repo:Coral-Reef-Ventures@337009897/coral-reef-site@1402479746:environment:${Environment}

  StreamlaneDeploy:
    Type: AWS::IAM::Role
    Condition: Deploys
    Properties:
      RoleName: github-deploy-streamlane
      ManagedPolicyArns: [!Ref DeployPolicy]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:Coral-Reef-Ventures/streamlane:environment:${Environment}
                  - !Sub repo:Coral-Reef-Ventures@337009897/streamlane@1391669013:environment:${Environment}
                  # The public site's own environments (Streamlane SL-326): its deploys report site-<env>, so a
                  # site deploy is never read as the product's.
                  - !Sub repo:Coral-Reef-Ventures/streamlane:environment:site-${Environment}
                  - !Sub repo:Coral-Reef-Ventures@337009897/streamlane@1391669013:environment:site-${Environment}

  DriftlineDeploy:
    Type: AWS::IAM::Role
    Condition: Deploys
    Properties:
      RoleName: github-deploy-driftline
      ManagedPolicyArns: [!Ref DeployPolicy]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:Coral-Reef-Ventures/driftline:environment:${Environment}
                  - !Sub repo:Coral-Reef-Ventures@337009897/driftline@1403608451:environment:${Environment}

  IntentsetDeploy:
    Type: AWS::IAM::Role
    Condition: Deploys
    Properties:
      RoleName: github-deploy-intentset
      ManagedPolicyArns: [!Ref DeployPolicy]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:intentset/intentset:environment:${Environment}
                  - !Sub repo:intentset@337154057/intentset@1402454146:environment:${Environment}

  # What a deploy hands to a build in the same account: a backend's outputs, keyed by commit, which the app's Amplify
  # build downloads (the plan's decision 3d). Kept 90 days; nothing in it is a secret, but nothing in it is public.
  BuildArtifacts:
    Type: AWS::S3::Bucket
    Condition: Deploys
    Properties:
      BucketName: !Sub crv-build-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: 90

  # Streamlane's data scripts (the demo seed, ADR 0039), run by hand from GitHub: they write through the writer's own
  # code, which reads and writes the tables, invokes the areas' functions, looks people up in the user pool and writes
  # the snapshot bucket. Prod's environment may assume it too since 2026-10-14, for the demo organization (Streamlane's
  # plan, step 6); like a prod deploy, only the product owner starts a prod run.
  StreamlaneDataRole:
    Type: AWS::IAM::Role
    Condition: Deploys
    Properties:
      RoleName: github-data-streamlane
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              ForAnyValue:StringEquals:
                token.actions.githubusercontent.com:sub:
                  - repo:Coral-Reef-Ventures/streamlane:environment:dev
                  - repo:Coral-Reef-Ventures@337009897/streamlane@1391669013:environment:dev
                  - repo:Coral-Reef-Ventures/streamlane:environment:staging
                  - repo:Coral-Reef-Ventures@337009897/streamlane@1391669013:environment:staging
                  - repo:Coral-Reef-Ventures/streamlane:environment:prod
                  - repo:Coral-Reef-Ventures@337009897/streamlane@1391669013:environment:prod
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:ListTables
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: "*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:DescribeUserPool
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::amplify-*
                  - arn:aws:s3:::amplify-*/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::crv-build-artifacts-${AWS::AccountId}/*
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/streamlane/*
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStacks
                Resource: "*"

  # Every build's own role. Amplify Hosting assumes it to build the app and deploy its Amplify Gen 2 backend.
  AmplifyBackendDeploy:
    Type: AWS::IAM::Role
    Properties:
      RoleName: amplify-backend-deploy
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmplifyBackendDeployFullAccess]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::crv-build-artifacts-${AWS::AccountId}/*
        # A server-rendered app's logs: Amplify writes them as this role, under /aws/amplify/<app id>.
        - PolicyName: ssr-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/amplify/*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*

Outputs:
  AmplifyServiceRole:
    Value: !GetAtt AmplifyBackendDeploy.Arn
