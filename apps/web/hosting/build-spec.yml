# Build settings for the Amplify Hosting app that serves the Coral Reef Ventures app (apps/web/hosting/README.md).
#
# This file is deliberately not at the repository root: Amplify applies a root amplify.yml to every app built from
# this repository. It is applied to this app only, with
# `aws amplify update-app --build-spec file://apps/web/hosting/build-spec.yml`.
#
# The backend (the repository's amplify/ folder) sits at the repository root while the app sits in apps/web, so each
# phase starts by moving to the repository root, whatever directory Amplify starts it in. `ampx` writes
# amplify_outputs.json into apps/web, where the Next.js build reads it.
version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - nvm install 24
            - corepack enable
            - cd "$(git rev-parse --show-toplevel)"
            - pnpm install --frozen-lockfile
            - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
            - corepack enable
            - cd "$(git rev-parse --show-toplevel)"
        build:
          commands:
            - pnpm --filter @crv/web build
            # Publish the door's public key for the product sites' builds. The key's ARN is a backend output; the
            # build role may read the key through the key's own policy. door-jwks.mjs writes
            # out/.well-known/crv-door-jwks.json, or fails the build unless the key is EC on P-256.
            - DOOR_KEY_ARN=$(node -p "require('./apps/web/amplify_outputs.json').custom.doorKeyArn")
            - DOOR_KID=$(node -p "require('./apps/web/amplify_outputs.json').custom.doorKid")
            - aws kms get-public-key --key-id "$DOOR_KEY_ARN" --query PublicKey --output text | DOOR_KID="$DOOR_KID" node apps/web/scripts/door-jwks.mjs
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
