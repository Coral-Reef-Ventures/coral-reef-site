# Deploys the app to its environments (apps/web/hosting/environments.ts; Streamlane ADR 0087):
#
# - dev, on every push to main;
# - staging, nightly, from the commit dev last deployed successfully, when it is new to staging;
# - prod, only when the product owner starts this workflow by hand (Actions, Deploy, Run workflow, prod). An agent
#   never starts it (CLAUDE.md). With no commit given, prod ships what staging last deployed successfully;
# - prod again, nightly, rebuilding the commit prod already runs (deployed/prod), so /streamlane/roadmap/, which the
#   build reads from Streamlane's own planning team (CRV-015), is at most a day old. It ships nothing new: the same
#   commit, its backend redeployed unchanged and its export rebuilt. It extends to this site the product owner's choice for
#   Streamlane's own site on 2026-10-15 (streamlane #974: "A day"), the one exception to prod-by-hand; dropping it is
#   removing the second schedule below.
#
# Each deploy runs in the GitHub environment of the same name, whose AWS_ROLE_ARN only that environment can assume
# (infra/accounts/baseline.yml), so a deploy can reach only its own account. A successful deploy moves the tag
# deployed/<environment> to the commit it shipped, which is what the next environment up promotes. (GitHub's own
# deployment records name the commit the workflow ran on, which for a scheduled or manual run is main's head, not
# the commit shipped.)
name: Deploy
# Names the environment in the runs list, which otherwise titles every scheduled run the same.
run-name: >-
  Deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.environment
  || github.event.schedule == '45 9 * * *' && 'prod (nightly refresh)'
  || github.event_name == 'schedule' && 'staging (nightly)' || 'dev' }}${{ inputs.ref && format(' at {0}', inputs.ref) || '' }}
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # 03:00 CDT: staging, from what dev last deployed
    - cron: "45 9 * * *" # 04:45 CDT: prod rebuilds the commit it runs, for the roadmap (CRV-015; streamlane #974)
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: The commit to ship (empty for what the environment below last deployed)
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.choose.outputs.environment }}
      sha: ${{ steps.choose.outputs.sha }}
    steps:
      - id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # The commit an environment last deployed successfully: its deployed/<environment> tag.
          last() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deployed/$1" --jq .object.sha 2>/dev/null || true
          }
          case "$EVENT" in
            push) environment=dev; sha=$GITHUB_SHA ;;
            schedule)
              if [ "$SCHEDULE" = "45 9 * * *" ]; then
                # Prod's nightly refresh: the commit prod already runs, never a newer one.
                environment=prod; sha=$(last prod)
              else
                environment=staging; sha=$(last dev)
                if [ -n "$sha" ] && [ "$sha" = "$(last staging)" ]; then echo "staging already has $sha"; sha=""; fi
              fi ;;
            workflow_dispatch)
              environment=$INPUT_ENVIRONMENT
              if [ -n "$INPUT_REF" ]; then sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_REF" --jq .sha)
              elif [ "$environment" = prod ]; then sha=$(last staging)
              else sha=$(last dev); fi
              [ -n "$sha" ] || { echo "Nothing to ship: no successful deploy below $environment"; exit 1; } ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha:-nothing} to $environment"

  deploy:
    needs: choose
    if: needs.choose.outputs.sha != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.choose.outputs.environment }}
    concurrency: deploy-${{ needs.choose.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.choose.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: deploy-${{ needs.choose.outputs.environment }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: node scripts/deploy.ts ${{ needs.choose.outputs.environment }}
      - name: Record what this environment runs
        env:
          ENVIRONMENT: ${{ needs.choose.outputs.environment }}
          SHA: ${{ needs.choose.outputs.sha }}
        run: |
          git tag -f "deployed/$ENVIRONMENT" "$SHA"
          git push -f origin "refs/tags/deployed/$ENVIRONMENT"
